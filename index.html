<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <title>MJ Chat App</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2196F3">
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIk1KIENoYXQgQXBwIiwKICAic2hvcnRfbmFtZSI6ICJNSiBDaGF0IiwKICAic3RhcnRfdXJsIjogIi4iLAogICJkaXNwbGF5IjogInN0YW5kYWxvbmUiLAogICJiYWNrZ3JvdW5kX2NvbG9yIjogIiNmMGYycjUiLAogICJ0aGVtZV9jb2xvciI6ICIjMjE5NkYzIiwKICAiaWNvbnMiOiBbCiAgICB7CiAgICAgICJzcmMiOiAiaHR0cHM6Ly92aWEucGxhY2Vob2xkZXIuY29tLzE5Mi8yMTk2RjMvZmZmZmZmP3RleHQ9TUoiLAogICAgICAic2l6ZXMiOiAiMTkyeDE5MiIsCiAgICAgICJ0eXBlIjogImltYWdlL3BuZyIKICAgIH0KICBdCn0=">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/2196F3/ffffff?text=MJ">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --chat-bg: #e5ddd5;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --primary-color: #2196F3;
            --primary-light: #e3f2fd;
            --my-msg-bg: #dcf8c6;
            --other-msg-bg: #ffffff;
            --border-color: #e0e0e0;
            --shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --chat-bg: #0b141a;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-muted: #aaaaaa;
            --primary-color: #2196F3;
            --primary-light: #1e3a5f;
            --my-msg-bg: #005c4b;
            --other-msg-bg: #202c33;
            --border-color: #333333;
            --shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            background-color: var(--panel-bg);
            display: flex;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 769px) {
            #app-container {
                height: 95vh;
                border-radius: 12px;
            }
        }

        /* Sidebar Style */
        .sidebar {
            width: 320px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 15px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-actions {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .friend-list {
            flex: 1;
            overflow-y: auto;
        }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .friend-item:hover, .friend-item.active {
            background-color: var(--primary-light);
        }

        .friend-info {
            flex: 1;
            overflow: hidden;
        }

        .friend-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .friend-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Chat Area Style */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            position: relative;
        }

        .chat-header {
            padding: 10px 15px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .back-btn {
            display: none;
            margin-right: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .messages-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            word-wrap: break-word;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message.sent {
            align-self: flex-end;
            background-color: var(--my-msg-bg);
            border-top-right-radius: 0;
        }

        .message.received {
            align-self: flex-start;
            background-color: var(--other-msg-bg);
            border-top-left-radius: 0;
        }

        .message-time {
            font-size: 10px;
            color: var(--text-muted);
            text-align: right;
            margin-top: 4px;
        }

        .message-img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
        }

        .reply-preview-box {
            background-color: rgba(0, 0, 0, 0.05);
            border-left: 3px solid var(--primary-color);
            padding: 4px 8px;
            font-size: 12px;
            margin-bottom: 5px;
            border-radius: 2px;
        }

        /* Input Area Style */
        .input-area {
            padding: 10px;
            background-color: var(--panel-bg);
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-color);
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .input-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        /* Panels (Emoji / Sticker) */
        .panel {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            height: 200px;
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        .panel-header {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            background-color: var(--bg-color);
        }

        .panel-tab.active {
            background-color: var(--panel-bg);
            border-bottom: 2px solid var(--primary-color);
        }

        .panel-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            align-content: start;
        }

        .sticker-item, .emoji-item {
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
        }

        .sticker-item img {
            width: 100%;
            height: auto;
        }

        /* Image Editor Overlay */
        #editor-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .editor-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            color: white;
            background-color: #000;
        }

        .editor-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #editor-canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .editor-toolbar {
            padding: 15px;
            background-color: #000;
            display: flex;
            justify-content: space-around;
            color: white;
        }

        .editor-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        /* Context Menu & Reply Banner */
        #reply-banner {
            display: none;
            background-color: var(--primary-light);
            padding: 8px 12px;
            font-size: 12px;
            border-left: 4px solid var(--primary-color);
            justify-content: space-between;
            align-items: center;
        }

        .context-menu {
            position: absolute;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            border-radius: 6px;
            display: none;
            flex-direction: column;
            z-index: 200;
        }

        .context-menu-item {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .context-menu-item:hover {
            background-color: var(--primary-light);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: absolute;
                height: 100%;
            }
            .sidebar.hidden {
                transform: translateX(-100%);
            }
            .back-btn {
                display: block;
            }
        }
    </style>
</head>
<body>

<div id="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="user-profile">
                <div class="avatar" id="my-avatar">M</div>
                <span id="my-name" style="font-weight: 600;">MJ</span>
            </div>
            <div class="sidebar-actions">
                <i class="fas fa-moon" id="theme-toggle" title="เปลี่ยนธีม"></i>
                <i class="fas fa-user-plus" id="add-friend-btn" title="เพิ่มเพื่อน"></i>
            </div>
        </div>
        <div class="friend-list" id="friend-list">
            <!-- Friend Items -->
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header">
            <div style="display: flex; align-items: center;">
                <i class="fas fa-arrow-left back-btn" id="back-btn"></i>
                <div class="avatar" id="active-avatar" style="margin-right: 10px;">?</div>
                <div>
                    <div id="active-name" style="font-weight: 600;">เลือกเพื่อนเพื่อเริ่มแชท</div>
                    <div id="active-status" style="font-size: 12px; color: var(--text-muted);">offline</div>
                </div>
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <!-- Messages -->
        </div>

        <!-- Reply Banner -->
        <div id="reply-banner">
            <div>
                <span style="font-weight: bold;" id="reply-user">Reply:</span>
                <span id="reply-text">...</span>
            </div>
            <i class="fas fa-times" id="cancel-reply" style="cursor: pointer;"></i>
        </div>

        <!-- Panels -->
        <div class="panel" id="emoji-panel">
            <div class="panel-header">
                <div class="panel-tab active" id="tab-emoji">Emoji</div>
                <div class="panel-tab" id="tab-sticker">Stickers</div>
            </div>
            <div class="panel-content" id="panel-content">
                <!-- Emojis / Stickers -->
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <button class="input-btn" id="btn-emoji"><i class="far fa-smile"></i></button>
            <button class="input-btn" id="btn-attach"><i class="fas fa-paperclip"></i></button>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            
            <input type="text" id="msg-input" placeholder="พิมพ์ข้อความ..." disabled>
            <button class="input-btn" id="btn-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div class="context-menu" id="context-menu">
    <div class="context-menu-item" id="cm-reply"><i class="fas fa-reply"></i> ตอบกลับ</div>
    <div class="context-menu-item" id="cm-copy"><i class="fas fa-copy"></i> คัดลอก</div>
    <div class="context-menu-item" id="cm-delete" style="color: red;"><i class="fas fa-trash"></i> ลบ</div>
</div>

<!-- Image Editor Modal -->
<div id="editor-modal">
    <div class="editor-header">
        <span id="cancel-edit" style="cursor: pointer;">ยกเลิก</span>
        <span>แก้ไขรูปภาพ</span>
        <span id="save-edit" style="color: var(--primary-color); cursor: pointer; font-weight: bold;">ส่ง</span>
    </div>
    <div class="editor-body">
        <canvas id="editor-canvas"></canvas>
    </div>
    <div class="editor-toolbar">
        <button class="editor-btn" id="tool-draw"><i class="fas fa-pen"></i><span>วาด</span></button>
        <button class="editor-btn" id="tool-blur"><i class="fas fa-border-none"></i><span>เบลอ</span></button>
        <button class="editor-btn" id="tool-rotate"><i class="fas fa-redo"></i><span>หมุน</span></button>
        <button class="editor-btn" id="tool-clear"><i class="fas fa-undo"></i><span>รีเซ็ต</span></button>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // App State
    let currentUser = { id: 'user_mj', name: 'MJ' };
    let activeFriend = null;
    let replyToMessage = null;
    let selectedMessageId = null;
    let selectedMessageText = "";

    // DOM Elements
    const msgInput = document.getElementById('msg-input');
    const messagesContainer = document.getElementById('messages-container');
    const fileInput = document.getElementById('file-input');
    const friendListEl = document.getElementById('friend-list');

    // Context Menu Elements
    const contextMenu = document.getElementById('context-menu');

    // Canvas Editor State
    let editorCanvas = document.getElementById('editor-canvas');
    let ctx = editorCanvas.getContext('2d');
    let originalImage = new Image();
    let isDrawing = false;
    let currentTool = null;
    let lastX = 0, lastY = 0;

    // --- Helper Functions ---
    function formatTime(timestamp) {
        const date = new Date(timestamp);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // --- 1. Check File Size & Compress Image (กำหนดไม่เกิน 5MB & บีบอัด 90%) ---
    document.getElementById('btn-attach').addEventListener('click', () => {
        if (!activeFriend) return alert('กรุณาเลือกเพื่อนก่อนส่งไฟล์');
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const MAX_SIZE_MB = 5;
        const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024; // 5 MB

        // เช็คขนาดไฟล์ไม่เกิน 5 MB
        if (file.size > MAX_SIZE_BYTES) {
            alert(`ไฟล์มีขนาดใหญ่เกินไป! กรุณาเลือกไฟล์ที่ไม่เกิน ${MAX_SIZE_MB} MB`);
            fileInput.value = '';
            return;
        }

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (event) => {
                originalImage.onload = () => {
                    openEditor();
                };
                originalImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            alert('รองรับเฉพาะไฟล์รูปภาพค่ะ');
        }
        
        fileInput.value = '';
    });

    // --- Image Editor Methods ---
    function openEditor() {
        document.getElementById('editor-modal').style.display = 'flex';
        editorCanvas.width = originalImage.width;
        editorCanvas.height = originalImage.height;
        ctx.drawImage(originalImage, 0, 0);
    }

    document.getElementById('cancel-edit').addEventListener('click', () => {
        document.getElementById('editor-modal').style.display = 'none';
    });

    document.getElementById('tool-clear').addEventListener('click', () => {
        ctx.drawImage(originalImage, 0, 0);
    });

    document.getElementById('tool-rotate').addEventListener('click', () => {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = editorCanvas.height;
        tempCanvas.height = editorCanvas.width;
        const tempCtx = tempCanvas.getContext('2d');
        
        tempCtx.translate(tempCanvas.width / 2, tempCanvas.height / 2);
        tempCtx.rotate(90 * Math.PI / 180);
        tempCtx.drawImage(editorCanvas, -editorCanvas.width / 2, -editorCanvas.height / 2);
        
        editorCanvas.width = tempCanvas.width;
        editorCanvas.height = tempCanvas.height;
        ctx.drawImage(tempCanvas, 0, 0);
    });

    document.getElementById('tool-draw').addEventListener('click', () => { currentTool = 'draw'; });
    document.getElementById('tool-blur').addEventListener('click', () => { currentTool = 'blur'; });

    // Drawing Listeners
    editorCanvas.addEventListener('mousedown', startDrawing);
    editorCanvas.addEventListener('mousemove', draw);
    editorCanvas.addEventListener('mouseup', stopDrawing);

    editorCanvas.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startDrawing({ clientX: touch.clientX, clientY: touch.clientY });
    });
    editorCanvas.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        draw({ clientX: touch.clientX, clientY: touch.clientY });
    });
    editorCanvas.addEventListener('touchend', stopDrawing);

    function getCanvasCoords(e) {
        const rect = editorCanvas.getBoundingClientRect();
        const scaleX = editorCanvas.width / rect.width;
        const scaleY = editorCanvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        const coords = getCanvasCoords(e);
        lastX = coords.x;
        lastY = coords.y;
    }

    function draw(e) {
        if (!isDrawing || !currentTool) return;
        const coords = getCanvasCoords(e);

        if (currentTool === 'draw') {
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.stroke();
        } else if (currentTool === 'blur') {
            const size = 20;
            const x = Math.floor(coords.x / size) * size;
            const y = Math.floor(coords.y / size) * size;
            ctx.fillStyle = '#888888';
            ctx.fillRect(x, y, size, size);
        }

        lastX = coords.x;
        lastY = coords.y;
    }

    function stopDrawing() { isDrawing = false; }

    // กดส่งรูป (บีบอัดรูปภาพเป็น JPEG คุณภาพ 90% / 0.9)
    document.getElementById('save-edit').addEventListener('click', () => {
        if (!activeFriend) return;
        const compressedImageData = editorCanvas.toDataURL('image/jpeg', 0.9);
        sendMessage({ image: compressedImageData });
        document.getElementById('editor-modal').style.display = 'none';
    });

    // --- Message Send & Receive ---
    function sendMessage(data) {
        if (!activeFriend) return;

        const chatId = getChatId(currentUser.id, activeFriend.id);
        const msgRef = db.ref(`chats/${chatId}`).push();

        const messageData = {
            sender: currentUser.id,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            ...data
        };

        if (replyToMessage) {
            messageData.replyTo = replyToMessage;
        }

        msgRef.set(messageData);
        clearReply();
    }

    document.getElementById('btn-send').addEventListener('click', () => {
        const text = msgInput.value.trim();
        if (text) {
            sendMessage({ text: text });
            msgInput.value = '';
        }
    });

    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('btn-send').click();
        }
    });

    function getChatId(uid1, uid2) {
        return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
    }

    function clearReply() {
        replyToMessage = null;
        document.getElementById('reply-banner').style.display = 'none';
    }

    document.getElementById('cancel-reply').addEventListener('click', clearReply);

    // --- Context Menu Actions ---
    window.addEventListener('click', () => {
        contextMenu.style.display = 'none';
    });

    function showContextMenu(e, msgId, text) {
        e.preventDefault();
        selectedMessageId = msgId;
        selectedMessageText = text;
        contextMenu.style.left = `${e.clientX}px`;
        contextMenu.style.top = `${e.clientY}px`;
        contextMenu.style.display = 'flex';
    }

    document.getElementById('cm-reply').addEventListener('click', () => {
        if (selectedMessageText) {
            replyToMessage = selectedMessageText;
            document.getElementById('reply-user').innerText = 'Reply:';
            document.getElementById('reply-text').innerText = selectedMessageText;
            document.getElementById('reply-banner').style.display = 'flex';
        }
    });

    document.getElementById('cm-copy').addEventListener('click', () => {
        if (selectedMessageText) {
            navigator.clipboard.writeText(selectedMessageText);
        }
    });

    document.getElementById('cm-delete').addEventListener('click', () => {
        if (selectedMessageId && activeFriend) {
            const chatId = getChatId(currentUser.id, activeFriend.id);
            db.ref(`chats/${chatId}/${selectedMessageId}`).remove();
        }
    });

    // --- UI Actions & Panels ---
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const currentTheme = document.body.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            document.body.removeAttribute('data-theme');
        } else {
            document.body.setAttribute('data-theme', 'dark');
        }
    });

    document.getElementById('btn-emoji').addEventListener('click', () => {
        const panel = document.getElementById('emoji-panel');
        if (panel.style.display === 'flex') {
            panel.style.display = 'none';
        } else {
            panel.style.display = 'flex';
            loadEmojis();
        }
    });

    document.getElementById('tab-emoji').addEventListener('click', (e) => {
        document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        loadEmojis();
    });

    document.getElementById('tab-sticker').addEventListener('click', (e) => {
        document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        loadStickers();
    });

    function loadEmojis() {
        const content = document.getElementById('panel-content');
        const emojis = ['😀', '😂', '😍', '😎', '😭', '👍', '❤️', '🔥', '🎉', '🙏', '😊', '🥳', '🤔', '😴', '🙈', '👏', '💪', '✨'];
        content.innerHTML = emojis.map(e => `<div class="emoji-item">${e}</div>`).join('');
        
        document.querySelectorAll('.emoji-item').forEach(item => {
            item.addEventListener('click', (e) => {
                msgInput.value += e.target.innerText;
            });
        });
    }

    function loadStickers() {
        const content = document.getElementById('panel-content');
        const stickers = [
            'https://via.placeholder.com/100/2196F3/ffffff?text=Hello',
            'https://via.placeholder.com/100/4CAF50/ffffff?text=OK',
            'https://via.placeholder.com/100/FF9800/ffffff?text=Thanks',
            'https://via.placeholder.com/100/E91E63/ffffff?text=Love'
        ];
        content.innerHTML = stickers.map(s => `<div class="sticker-item"><img src="${s}" /></div>`).join('');
        
        document.querySelectorAll('.sticker-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const imgUrl = e.target.src;
                if (imgUrl) {
                    sendMessage({ image: imgUrl });
                    document.getElementById('emoji-panel').style.display = 'none';
                }
            });
        });
    }

    document.getElementById('back-btn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('hidden');
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }
</script>
</body>
</html>
